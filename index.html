<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Welcome HOME — 기도로 짓는 집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Jost:wght@200;300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#05070b;--blue:#183550;--blue2:#5f86a8;--line:#9ab9d2;--gold:#f7e2a0;
 --white:#f7f7f4;--muted:rgba(247,247,244,.58);--card:rgba(13,31,49,.88);
 --sans:Jost,"Noto Sans KR",sans-serif;--kr:"Noto Sans KR",sans-serif;--script:Italianno,cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#05070b}
body{font-family:var(--kr);color:var(--white);font-weight:300;overflow-x:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:20;opacity:.2;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px)}
.app{min-height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(36,76,108,.2),transparent 48%),var(--bg);transition:background 1.8s ease}
.app[data-p="1"]{background:radial-gradient(circle at 50% 46%,rgba(97,137,168,.36),transparent 54%),#5d7e9b}
.shell{width:min(100%,520px);min-height:100svh;margin:auto;padding:22px 20px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;position:relative;z-index:2}
.top{display:flex;justify-content:center;align-items:center;padding-top:4px}
.logo{width:min(72vw,300px);display:flex;justify-content:center;align-items:center;opacity:.15;transform:translateY(4px) scale(.97);transition:opacity 1.8s,transform 1.8s}
.logo.ready{opacity:1;transform:none}
.logo img{display:block;width:100%;height:auto;object-fit:contain}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.house-wrap{width:min(100%,440px);aspect-ratio:9/16;position:relative;display:grid;place-items:center}
.blueprint,.realhouse,.stage-image{position:absolute;inset:0;width:100%;height:100%}
.blueprint{opacity:.04;transform:scale(.92);transition:opacity 1.7s,transform 2s}
.stage-image{object-fit:cover;opacity:0;transform:scale(1);transition:opacity 1.8s ease,transform 2.4s ease;pointer-events:none}
.stage-image.active{opacity:1}
.realhouse{opacity:0;transform:scale(.91) translateY(8px);transition:opacity 2.4s,transform 2.4s}
.house-wrap.final .blueprint{opacity:0}
.house-wrap.final .realhouse{opacity:0}
.house-wrap.final .stage-image.final-image{opacity:1;transform:scale(1)}
.house-wrap.final .stage-image:not(.final-image){opacity:0}
.house-wrap.image-stage .blueprint{opacity:0}
.house-wrap.image-stage .realhouse{opacity:0}
.bp-grid{stroke:rgba(176,205,226,.18);stroke-width:.5}
.bp-line{fill:none;stroke:var(--line);stroke-width:1.1;vector-effect:non-scaling-stroke}
.bp-fine{fill:none;stroke:rgba(171,202,224,.62);stroke-width:.65;vector-effect:non-scaling-stroke}
.bp-glow{fill:none;stroke:#d9ecff;stroke-width:2.5;opacity:.18;filter:blur(3px)}
.house-fill{fill:url(#wall)}
.roof-fill{fill:url(#roof)}
.window-fill{fill:#f8dc80;filter:url(#light)}
.ground{fill:url(#ground)}
.stage-copy{position:absolute;bottom:3%;left:0;right:0;text-align:center;pointer-events:none}
.stage-copy strong{display:block;font-size:13px;letter-spacing:.06em;font-weight:300;opacity:.9}
.stage-copy span{display:block;margin-top:4px;font-family:var(--sans);font-size:9px;letter-spacing:.18em;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;width:100%;margin:0 0 17px}
.stat{text-align:center}.stat .label{font-size:10px;color:var(--muted);letter-spacing:.12em}.stat .value{margin-top:3px;font-family:var(--sans);font-size:30px;font-weight:300;color:var(--gold);line-height:1}.stat .unit{font-size:12px;margin-left:3px;color:var(--gold)}.divider{width:1px;height:34px;background:rgba(255,255,255,.18)}
.pray{width:100%;height:60px;border:1px solid rgba(247,226,160,.7);background:rgba(247,226,160,.96);color:#172331;font-size:16px;letter-spacing:.06em;border-radius:2px;box-shadow:0 12px 34px rgba(0,0,0,.2);transition:transform .15s}
.pray:active{transform:scale(.985)}
.pray .hands{font-size:22px;vertical-align:-2px;margin-right:8px}
.progress{height:2px;background:rgba(255,255,255,.1);margin:14px 0 0;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width 1.4s ease}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(12px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-back.open{display:flex}
.modal{width:min(100%,520px);background:linear-gradient(180deg,#102d48,#091827);border:1px solid rgba(155,191,216,.3);border-bottom:0;border-radius:20px 20px 0 0;padding:22px 20px max(24px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.45);animation:up .28s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.modal-title{font-size:20px;font-weight:400}.modal-title span{font-size:22px;margin-right:7px}.close{border:0;background:none;color:var(--muted);font-size:24px;padding:4px 2px}
.field{margin-top:16px}.field label{display:block;font-size:11px;letter-spacing:.13em;color:var(--gold);margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid rgba(170,200,220,.22);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;padding:13px 14px;outline:none}.field input:focus,.field textarea:focus{border-color:rgba(247,226,160,.7)}.field textarea{height:70px;resize:none}.optional{font-size:9px;color:var(--muted);letter-spacing:0;margin-left:5px}
.picker{height:174px;position:relative;margin:3px -3px 0}.scroll{height:100%;overflow:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent,#000 27%,#000 73%,transparent)}.scroll::-webkit-scrollbar{display:none}.pad{height:65px}.minute{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;color:rgba(255,255,255,.28);font-size:15px;transition:.2s}.minute.on{font-size:23px;color:var(--gold);font-weight:300}.pick-band{position:absolute;left:8%;right:8%;top:65px;height:44px;border-top:1px solid rgba(247,226,160,.35);border-bottom:1px solid rgba(247,226,160,.35);pointer-events:none}.pick-band:after{content:"분";position:absolute;right:-25px;top:7px;color:var(--gold);font-size:11px}
.submit{width:100%;height:54px;border:0;border-radius:8px;background:var(--gold);color:#172331;margin-top:19px;font-size:15px}.submit:disabled{opacity:.5}.alert{font-size:12px;color:#ffb4a3;min-height:18px;margin:8px 0 0}
.done{text-align:center;padding:18px 5px 5px}.verse-box{padding:18px 12px 20px;border-top:1px solid rgba(247,226,160,.22);border-bottom:1px solid rgba(247,226,160,.22)}.verse-text{margin:0;color:var(--white);font-size:16px;line-height:2;font-weight:300;word-break:keep-all}.verse-ref{margin-top:14px;color:var(--gold);font-family:var(--sans);font-size:12px;letter-spacing:.08em}.done button{margin-top:20px;width:100%;height:52px;border:1px solid rgba(247,226,160,.65);background:transparent;color:var(--gold);border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(min-width:700px){body{background:#020305}.shell{min-height:900px}.app{border-radius:26px;margin:20px auto;min-height:calc(100svh - 40px);max-height:960px;box-shadow:0 30px 100px #000}.modal-back{align-items:center}.modal{border:1px solid rgba(155,191,216,.3);border-radius:20px}}
</style>
</head>
<body>
<main class="app" id="app" data-p="0">
<div class="shell">
<header class="top">
  <div class="logo" id="logo"><img src="assets/logo.png" alt="Welcome HOME"></div>
</header>

<section class="stage">

    <svg class="blueprint" viewBox="0 0 400 400" aria-label="기도가 쌓일수록 완성되는 집 청사진">
      <defs>
        <linearGradient id="bpSky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7fa5c3" stop-opacity=".2"/><stop offset="1" stop-color="#274a66" stop-opacity="0"/></linearGradient>
      </defs>

      <g class="bp-grid">
        <path d="M20 40H380M20 80H380M20 120H380M20 160H380M20 200H380M20 240H380M20 280H380M20 320H380M20 360H380M40 20V380M80 20V380M120 20V380M160 20V380M200 20V380M240 20V380M280 20V380M320 20V380M360 20V380"/>

      </g>
    </svg>

    <img class="stage-image" data-stage="11" src="assets/11.png" alt="" aria-hidden="true">
    <img class="stage-image" data-stage="25" src="assets/25.png" alt="" aria-hidden="true">
    <img class="stage-image" data-stage="40" src="assets/40.png" alt="" aria-hidden="true">
    <img class="stage-image" data-stage="55" src="assets/55.png" alt="" aria-hidden="true">
    <img class="stage-image" data-stage="70" src="assets/70.png" alt="" aria-hidden="true">
    <img class="stage-image" data-stage="85" src="assets/85.png" alt="" aria-hidden="true">
    <img class="stage-image final-image" data-stage="100" src="assets/100.png" alt="" aria-hidden="true">

    <svg class="realhouse" viewBox="0 0 400 400" aria-hidden="true">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eee7d8"/><stop offset="1" stop-color="#cfc4af"/></linearGradient>
        <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#596981"/><stop offset="1" stop-color="#263347"/></linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4a5868"/><stop offset="1" stop-color="#182331"/></linearGradient>
        <filter id="light"><feGaussianBlur stdDeviation="2"/></filter>

      <path class="roof-fill" d="M113 171V132L143 108H257L287 132V171Z"/>
      <path fill="#d2c7b5" d="M108 199H292V209H108Z"/>
      <path fill="#7d6a57" d="M132 105V55H148V105ZM252 105V55H268V105Z"/>
      <path fill="#8d7157" d="M128 54H152V59H128ZM248 54H272V59H248Z"/>
      <g fill="#f7d96e">
        <rect x="92" y="236" width="42" height="48" rx="2"/><rect x="154" y="236" width="42" height="48" rx="2"/>
        <rect x="204" y="236" width="42" height="48" rx="2"/><rect x="266" y="236" width="42" height="48" rx="2"/>
        <path d="M166 184Q166 150 200 150T234 184V205H166Z"/>

      <g stroke="#675f55" stroke-width="3" opacity=".48">
        <path d="M113 236V284M92 260H134M175 236V284M154 260H196M225 236V284M204 260H246M287 236V284M266 260H308"/>

      <path fill="#66462e" d="M181 323V267Q181 242 200 242T219 267V323Z"/>
      <circle cx="214" cy="285" r="2.8" fill="#f6d36c"/>
      <path fill="#d9cfbd" d="M174 323H226L232 330H168Z"/>
      <path fill="#d9cfbd" d="M169 330H231L237 337H163Z"/>
      <g fill="#718b62"><circle cx="70" cy="320" r="13"/><circle cx="330" cy="320" r="13"/><circle cx="52" cy="331" r="9"/><circle cx="348" cy="331" r="9"/></g>
    </svg>
    <div class="stage-copy"><strong id="stageTitle">첫 기도를 기다리고 있습니다.</strong><span id="stageSub">PRAY · BUILD · WELCOME</span></div>
  </div>
</section>

<div class="stats">
  <div class="stat"><div class="label">기도 횟수</div><div class="value"><span id="prayerCount">0</span><span class="unit">회</span></div></div>
  <div class="divider"></div>
  <div class="stat"><div class="label">누적 기도시간</div><div class="value"><span id="totalMinutes">0</span><span class="unit">분</span></div></div>
</div>
<button class="pray" id="openPrayer"><span class="hands">🙏</span>기도하기</button>
<div class="progress"><i id="progressBar"></i></div>
</div>
</main>

<div class="modal-back" id="prayerModal">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><div class="modal-title" id="modalTitle"><span>🙏</span>기도하기</div><button class="close" id="closeModal" aria-label="닫기">×</button></div>
    <div class="field"><label for="name">이름</label><input id="name" maxlength="30" autocomplete="name" placeholder="이름을 입력해주세요"></div>
    <div class="field"><label>기도시간</label>
      <div class="picker"><div class="scroll" id="minuteScroll" tabindex="0" role="listbox" aria-label="기도시간"></div><div class="pick-band"></div></div>
    </div>
    <div class="field"><label for="topic">기도제목 <span class="optional">선택</span></label><textarea id="topic" maxlength="500" placeholder="기도제목을 남겨주세요"></textarea></div>
    <p class="alert" id="alert"></p>
    <button class="submit" id="submit">기도 올리기</button>
  </section>
</div>

<div class="modal-back" id="doneModal">
  <section class="modal done" role="dialog" aria-modal="true">
    <div class="verse-box">
      <p class="verse-text" id="verseText"></p>
      <div class="verse-ref" id="verseRef"></div>
    </div>
    <button id="doneClose">확인</button>
  </section>
</div>

<script>
(function(){
"use strict";
var SERVER_URL="https://script.google.com/macros/s/AKfycbwpCNRWgHknWBzv9cLjf4IMqwGsvgll3mDFb6WAfN79YAbkT9a_IPFFWa8eXyUICJ00/exec";
var GOAL_COUNT=300;
var state={minutes:0,count:0};
var $=function(id){return document.getElementById(id)};
var app=$("app"),wrap=$("houseWrap"),logo=$("logo");
var scroll=$("minuteScroll"),selected=30,timer=null;
var items=[];
var localKey="welcome.home.prayers.v3";
var VERSES=[
  {ref:"민수기 6:24-26",text:"여호와는 네게 복을 주시고 너를 지키시기를 원하며 여호와는 그의 얼굴을 네게 비추사 은혜 베푸시기를 원하며 여호와는 그 얼굴을 네게로 향하여 드사 평강 주시기를 원하노라"},
  {ref:"민수기 23:19",text:"하나님은 사람이 아니시니 거짓말을 하지 않으시고 인생이 아니시니 후회가 없으시도다 어찌 그 말씀하신 바를 행하지 않으시며 하신 말씀을 실행하지 않으시랴"},
  {ref:"신명기 28:12",text:"여호와께서 너를 위하여 하늘의 아름다운 보고를 여시사 네 땅에 때를 따라 비를 내리시고 네 손으로 하는 모든 일에 복을 주시리니"},
  {ref:"시편 1:3",text:"그는 시냇가에 심은 나무가 철을 따라 열매를 맺으며 그 잎사귀가 마르지 아니함 같으니 그가 하는 모든 일이 다 형통하리로다"},
  {ref:"시편 23:6",text:"내 평생에 선하심과 인자하심이 반드시 나를 따르리니 내가 여호와의 집에 영원히 살리로다"},
  {ref:"시편 37:5",text:"네 길을 여호와께 맡기라 그를 의지하면 그가 이루시고"},
  {ref:"시편 67:6",text:"땅이 그의 소산을 내어 주었으니 하나님 곧 우리 하나님이 우리에게 복을 주시리로다"},
  {ref:"시편 84:11",text:"여호와 하나님은 해요 방패이시라 여호와께서 은혜와 영화를 주시며 정직하게 행하는 자에게 좋은 것을 아끼지 아니하실 것임이니이다"},
  {ref:"잠언 3:5-6",text:"너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라 너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라"},
  {ref:"잠언 11:30",text:"의인의 열매는 생명 나무라 지혜로운 자는 사람을 얻느니라"},
  {ref:"이사야 37:31",text:"유다 족속 중에 피하여 남는 자는 다시 아래로 뿌리를 박고 위로 열매를 맺을지라"},
  {ref:"이사야 43:19",text:"보라 내가 새 일을 행하리니 이제 나타낼 것이라 너희가 그것을 알지 못하겠느냐 반드시 내가 광야에 길을 사막에 강을 내리니"},
  {ref:"이사야 55:11",text:"내 입에서 나가는 말도 이와 같이 헛되이 내게로 돌아오지 아니하고 나의 기뻐하는 뜻을 이루며 내가 보낸 일에 형통함이니라"},
  {ref:"이사야 55:12",text:"너희는 기쁨으로 나아가며 평안히 인도함을 받을 것이요 산들과 언덕들이 너희 앞에서 노래를 발하고 들의 모든 나무가 손뼉을 칠 것이며"},
  {ref:"예레미야 17:7-8",text:"그러나 무릇 여호와를 의지하며 여호와를 의뢰하는 그 사람은 복을 받을 것이라 그는 물 가에 심어진 나무가 그 뿌리를 강변에 뻗치고 더위가 올지라도 두려워하지 아니하며 그 잎이 청청하며 가무는 해에도 걱정이 없고 결실이 그치지 아니함 같으리라"},
  {ref:"에스겔 47:12",text:"그 나무에 먹을 만한 각종 과실나무가 자라서 그 열매가 끊이지 아니하고 달마다 새 열매를 맺으리니 이는 그 물이 성소를 통하여 나옴이라 그 열매는 먹을 만하고 그 잎사귀는 약재료가 되리라"},

function showRandomVerse(){
  var v=VERSES[Math.floor(Math.random()*VERSES.length)];
  $("verseText").textContent=v.text;
  $("verseRef").textContent=v.ref;
}


function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function setStats(minutes,count){
  state.minutes=Math.max(0,Number(minutes)||0);state.count=Math.max(0,Number(count)||0);
  var p=clamp(state.count/GOAL_COUNT,0,1);
  $("totalMinutes").textContent=Math.round(state.minutes).toLocaleString("ko-KR");
  $("prayerCount").textContent=Math.round(state.count).toLocaleString("ko-KR");
  $("progressBar").style.width=(p*100)+"%";
  app.dataset.p=p>=1?"1":"0";
  wrap.classList.toggle("final",p>=1);
  var percent=p*100;
  var blue=.04+.72*Math.pow(p,.72);
  var bp=document.querySelector(".blueprint");
  var imageNodes=document.querySelectorAll(".stage-image");
  var imageStage=percent>=11;
  wrap.classList.toggle("image-stage",imageStage);
  bp.style.opacity=imageStage?0:blue;
  bp.style.transform="scale("+(0.92+.08*p)+")";
  imageNodes.forEach(function(img){
    var stage=Number(img.dataset.stage);
    img.classList.toggle("active",imageStage && percent>=stage && percent<100);
    if(stage===100) img.classList.toggle("final-image",percent>=100);
  });
  if(percent>=100){
    imageNodes.forEach(function(img){img.classList.toggle("active",Number(img.dataset.stage)===100)});
  }
  if(p<=0){$("stageTitle").textContent="첫 기도를 기다리고 있습니다.";$("stageSub").textContent="PRAY · BUILD · WELCOME"}
  else if(p<.15){$("stageTitle").textContent="첫 선이 그려지고 있습니다.";$("stageSub").textContent="THE BLUEPRINT BEGINS"}
  else if(p<.4){$("stageTitle").textContent="기도가 집의 모양을 만들고 있습니다.";$("stageSub").textContent="PRAYER BECOMES A HOME"}
  else if(p<.75){$("stageTitle").textContent="우리의 기도가 집을 채워갑니다.";$("stageSub").textContent="ONE PRAYER AT A TIME"}
  else if(p<1){$("stageTitle").textContent="마지막까지 함께 채워주세요.";$("stageSub").textContent="ALMOST HOME"}
  else{$("stageTitle").textContent="기도가 집이 되었습니다.";$("stageSub").textContent="WELCOME HOME"}
}

function loadStats(){
  if(!SERVER_URL){loadLocal();return}
  fetch(SERVER_URL+"?t="+Date.now(),{redirect:"follow"})
    .then(function(r){return r.json()})
    .then(function(j){if(j&&j.ok)setStats(j.minutes,j.count);else loadLocal()})
    .catch(loadLocal);
}
function loadLocal(){
  try{
    var list=JSON.parse(localStorage.getItem(localKey)||"[]"),m=0;
    list.forEach(function(x){m+=Number(x.minutes)||0});
    setStats(m,list.length);
  }catch(e){setStats(0,0)}
}
function saveLocal(rec){
  try{
    var list=JSON.parse(localStorage.getItem(localKey)||"[]");list.push(rec);
    localStorage.setItem(localKey,JSON.stringify(list));loadLocal();
  }catch(e){}
}
function postPrayer(rec){
  if(!SERVER_URL){saveLocal(rec);return Promise.resolve()}
  return fetch(SERVER_URL,{
    method:"POST",redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action:"add",name:rec.name,minutes:rec.minutes,topic:rec.topic})
  }).then(function(r){return r.text()}).then(function(t){
    var j;try{j=JSON.parse(t)}catch(e){throw new Error("서버 응답을 읽을 수 없습니다.")}
    if(!j.ok)throw new Error(j.error||"저장에 실패했습니다.");
    setStats(j.minutes,j.count);
  });
}

function buildPicker(){
  var top=document.createElement("div");top.className="pad";scroll.appendChild(top);
  for(var i=1;i<=180;i++){
    var d=document.createElement("div");d.className="minute";d.textContent=i+"분";d.dataset.value=i;d.setAttribute("role","option");
    d.addEventListener("click",function(){pick(Number(this.dataset.value))});
    scroll.appendChild(d);items.push(d);
  }
  var bot=document.createElement("div");bot.className="pad";scroll.appendChild(bot);
  scroll.addEventListener("scroll",function(){
    var i=clamp(Math.round(scroll.scrollTop/44)+1,1,180);
    if(i!==selected){selected=i;paint()}
    clearTimeout(timer);timer=setTimeout(paint,80);
  },{passive:true});
  scroll.addEventListener("keydown",function(e){
    if(e.key==="ArrowDown"){e.preventDefault();pick(clamp(selected+1,1,180))}
    if(e.key==="ArrowUp"){e.preventDefault();pick(clamp(selected-1,1,180))}
  });
}
function paint(){items.forEach(function(x){var on=Number(x.dataset.value)===selected;x.classList.toggle("on",on);x.setAttribute("aria-selected",on)})}
function pick(n){selected=clamp(n,1,180);paint();scroll.scrollTo({top:(selected-1)*44,behavior:"smooth"})}
function resetForm(){ $("name").value="";$("topic").value="";$("alert").textContent="";selected=30;scroll.scrollTop=(selected-1)*44;paint() }
function openModal(){resetForm();$("prayerModal").classList.add("open");setTimeout(function(){$("name").focus()},180)}
function closeModal(){$("prayerModal").classList.remove("open")}
$("openPrayer").addEventListener("click",openModal);
$("closeModal").addEventListener("click",closeModal);
$("prayerModal").addEventListener("click",function(e){if(e.target===this)closeModal()});
$("doneClose").addEventListener("click",function(){$("doneModal").classList.remove("open")});

$("submit").addEventListener("click",function(){
  var name=$("name").value.trim(),topic=$("topic").value.trim(),btn=$("submit");
  $("alert").textContent="";
  if(!name){$("alert").textContent="이름을 입력해주세요.";return}
  btn.disabled=true;btn.textContent="올리는 중…";
  postPrayer({name:name,minutes:selected,topic:topic})
    .then(function(){closeModal();showRandomVerse();$("doneModal").classList.add("open")})
    .catch(function(e){$("alert").textContent=e.message||"저장에 실패했습니다."})
    .then(function(){btn.disabled=false;btn.textContent="기도 올리기"});
});

buildPicker();pick(30);
setTimeout(function(){logo.classList.add("ready")},180);
loadStats();
setInterval(loadStats,10000);
window.addEventListener("focus",loadStats);
})();
</script>
